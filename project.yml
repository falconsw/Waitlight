name: Waitlight
options:
  bundleIdPrefix: com.falconsw
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  defaultLocalization: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signing identity lives in Signing.xcconfig (ad-hoc unless a local
    # Local.xcconfig names a Developer ID).
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    ENABLE_HARDENED_RUNTIME: "YES"
    # Off for the same reason as Leftover: reading ~/.claude and running
    # /usr/bin/security are ordinary file and process access the sandbox forbids.
    ENABLE_APP_SANDBOX: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  Waitlight:
    type: application
    platform: macOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Sources
    entitlements:
      path: Sources/Waitlight.entitlements
      properties:
        # Selecting the Terminal or iTerm2 tab a session runs in is AppleScript;
        # under the hardened runtime that is refused without this.
        com.apple.security.automation.apple-events: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Waitlight
        CFBundleDisplayName: Waitlight
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - tr
        LSMinimumSystemVersion: "15.0"
        LSUIElement: true
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSAppleEventsUsageDescription: "Waitlight brings you back to the terminal tab an agent is waiting in."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.falconsw.waitlight
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: "YES"
        DEVELOPMENT_LANGUAGE: en

  WaitlightTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Waitlight
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.falconsw.waitlight.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Waitlight:
    build:
      targets:
        Waitlight: all
        WaitlightTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WaitlightTests
